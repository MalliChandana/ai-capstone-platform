spring.application.name=aicapstone

# Server Port
server.port=${PORT:8080}

# MySQL Database Connection (Environment variables with local fallbacks)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aicapstone?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:chandu@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Admin Credentials
app.admin.email=${APP_ADMIN_EMAIL:admin@aicapstone.io}
app.admin.password=${APP_ADMIN_PASSWORD:AdminPass123!}
app.admin.name=${APP_ADMIN_NAME:Platform Administrator}

# Demo Data Generation Toggle (false by default for production/clean DB)
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}

# Thymeleaf Cache
spring.thymeleaf.cache=false