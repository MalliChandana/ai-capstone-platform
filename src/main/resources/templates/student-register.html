<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | AI Capstone Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #e0e7ff 0%, #f8fafc 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-main);
        }
        .auth-container {
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.07);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
        }
        .auth-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-main);
            background: #ffffff;
            transition: all 0.2s ease;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }
        .btn {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
            margin-top: 8px;
        }
        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <div class="brand-badge">🎓</div>
        <h1>Create Student Account</h1>
        <p>Fill in your academic profile to unlock AI capstone recommendations</p>
    </div>

    <!-- Error Alert -->
    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <form action="/student/register" method="post">
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" placeholder="e.g. Alex Morgan" required>
            </div>

            <div class="form-group">
                <label for="email">Student Email *</label>
                <input type="email" id="email" name="email" placeholder="alex@university.edu" required>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Min. 6 characters" required>
            </div>

            <div class="form-group">
                <label for="department">Department / Major *</label>
                <input type="text" id="department" name="department" placeholder="e.g. Computer Science Engineering" required>
            </div>

            <div class="form-group">
                <label for="year">Academic Year *</label>
                <select id="year" name="year" required>
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year (Freshman)</option>
                    <option value="2nd Year">2nd Year (Sophomore)</option>
                    <option value="3rd Year">3rd Year (Junior)</option>
                    <option value="4th Year">4th Year (Senior / Final Year)</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="skills">Technical Skills (Comma Separated) *</label>
                <textarea id="skills" name="skills" placeholder="e.g. Python, Java, Machine Learning, React, MySQL, Docker" required></textarea>
            </div>

            <div class="form-group full-width">
                <label for="interests">Areas of Interest (Comma Separated) *</label>
                <textarea id="interests" name="interests" placeholder="e.g. Artificial Intelligence, Healthcare Analytics, Cloud Computing, FinTech" required></textarea>
            </div>
        </div>

        <button type="submit" class="btn">Create Student Profile</button>
    </form>

    <div class="auth-footer">
        Already registered? <a href="/student/login">Log In to Your Account</a>
    </div>
</div>

</body>
</html>
