<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Notifications | AI Capstone</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER NAVBAR */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border, #e2e8f0);
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #0f172a;
            font-size: 18px;
            font-weight: 800;
            white-space: nowrap;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #1e293b, #4f46e5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .nav-items {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            color: #4338ca;
            background: #f5f3ff;
        }

        .nav-link.active {
            color: #4338ca;
            background: #ede9fe;
            font-weight: 700;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 14px;
            white-space: nowrap;
        }

        .notif-badge {
            position: relative;
            text-decoration: none;
            color: #64748b;
            font-size: 18px;
            padding: 6px 8px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .notif-badge:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .notif-count {
            position: absolute;
            top: 0px;
            right: 0px;
            background: #ef4444;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            line-height: 1;
        }

        .btn-logout {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s ease;
            white-space: nowrap;
        }

        .btn-logout:hover {
            background: #fecaca;
            color: #991b1b;
        }

        @media (max-width: 900px) {
            .navbar { padding: 12px 18px; flex-wrap: wrap; }
            .nav-items { order: 3; width: 100%; justify-content: flex-start; margin-top: 6px; }
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 32px auto;
            padding: 0 24px;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .card h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notif-item {
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 12px;
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .notif-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .notif-msg {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
        }

        .notif-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-blue {
            background: var(--accent);
            color: white;
            white-space: nowrap;
        }

        .btn-outline {
            background: #f8fafc;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/company/dashboard" class="brand">
        <div class="brand-icon">🏢</div>
        <span>Company Portal</span>
    </a>

    <div class="nav-items">
        <a href="/" class="nav-link">Home</a>
        <a href="/company/dashboard" class="nav-link">Dashboard</a>
        <a href="/company/projects" class="nav-link">My Projects</a>
        <a href="/company/project/post" class="nav-link">+ Post Project</a>
        <a href="/company/registered-students" class="nav-link">Registered Students</a>
        <a href="/company/progress" class="nav-link">Track Progress</a>
        <a href="/company/reports" class="nav-link">Project Reports</a>
    </div>

    <div class="user-menu">
        <a href="/company/notifications" class="notif-badge" title="Notifications">
            🔔
        </a>
        <a href="/company/logout" class="btn-logout">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h1>🔔 Organization Notifications</h1>

        <div th:if="${notifications == null or notifications.isEmpty()}" style="text-align:center; padding: 40px; color: var(--text-muted);">
            <div style="font-size: 36px; margin-bottom: 12px;">🔕</div>
            <p>No notifications at this time.</p>
        </div>

        <div th:each="n : ${notifications}" class="notif-item">
            <div>
                <div class="notif-title" th:text="${n.title}">Notification Title</div>
                <div class="notif-msg" th:text="${n.message}">Notification message body...</div>
                <div class="notif-time">📅 <span th:text="${n.createdAt}">2026-08-26 12:00</span></div>
            </div>
            <div th:if="${n.link != null and !n.link.isEmpty()}">
                <a th:href="${n.link}" class="btn btn-blue">View →</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
