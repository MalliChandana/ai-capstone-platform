<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong | AI Capstone</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #e0e7ff 0%, #f8fafc 60%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-main);
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.07);
            max-width: 520px;
            width: 100%;
            padding: 48px 36px;
            text-align: center;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
        }
        .status-badge {
            display: inline-block;
            background: #fee2e2;
            color: #dc2626;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon">🛰️</div>
    <div class="status-badge" th:text="'HTTP Error ' + ${statusCode}">HTTP Error 404</div>
    <h1>Something Went Off Course</h1>
    <p th:text="${errorMessage}">The page you are looking for might have been moved, removed, or temporarily unavailable.</p>
    <div class="btn-group">
        <a href="/" class="btn btn-primary">Return to Home</a>
        <a href="/student/dashboard" class="btn btn-secondary">Student Dashboard</a>
        <a href="/company/dashboard" class="btn btn-secondary">Company Portal</a>
    </div>
</div>
</body>
</html>
