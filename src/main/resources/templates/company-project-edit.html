<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Capstone Project | AI Capstone</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER NAVBAR */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border, #e2e8f0);
            padding: 12px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #0f172a;
            font-size: 18px;
            font-weight: 800;
            white-space: nowrap;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #1e293b, #4f46e5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .nav-items {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-link {
            text-decoration: none;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            color: #4338ca;
            background: #f5f3ff;
        }

        .nav-link.active {
            color: #4338ca;
            background: #ede9fe;
            font-weight: 700;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 14px;
            white-space: nowrap;
        }

        .notif-badge {
            position: relative;
            text-decoration: none;
            color: #64748b;
            font-size: 18px;
            padding: 6px 8px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .notif-badge:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .notif-count {
            position: absolute;
            top: 0px;
            right: 0px;
            background: #ef4444;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            line-height: 1;
        }

        .btn-logout {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s ease;
            white-space: nowrap;
        }

        .btn-logout:hover {
            background: #fecaca;
            color: #991b1b;
        }

        @media (max-width: 900px) {
            .navbar { padding: 12px 18px; flex-wrap: wrap; }
            .nav-items { order: 3; width: 100%; justify-content: flex-start; margin-top: 6px; }
        }

        .container {
            max-width: 850px;
            width: 100%;
            margin: 32px auto;
            padding: 0 24px;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .card h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-main);
            background: #ffffff;
            outline: none;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-outline {
            background: #f8fafc;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/company/dashboard" class="brand">
        <div class="brand-icon">🏢</div>
        <span>Company Portal</span>
    </a>

    <div class="nav-items">
        <a href="/" class="nav-link">Home</a>
        <a href="/company/dashboard" class="nav-link">Dashboard</a>
        <a href="/company/projects" class="nav-link active">My Projects</a>
        <a href="/company/project/post" class="nav-link">+ Post Project</a>
        <a href="/company/registered-students" class="nav-link">Registered Students</a>
        <a href="/company/progress" class="nav-link">Track Progress</a>
        <a href="/company/reports" class="nav-link">Project Reports</a>
    </div>

    <div class="user-menu">
        <a href="/company/notifications" class="notif-badge" title="Notifications">
            🔔
            <span class="notif-count" th:if="${unreadNotifications != null and unreadNotifications > 0}" th:text="${unreadNotifications}">0</span>
        </a>
        <a href="/company/logout" class="btn-logout">Logout</a>
    </div>
</nav>

<div class="container">

    <div class="card">
        <h1>✏️ Edit Capstone Project</h1>
        <p>Update project details, timelines, and required skill criteria.</p>

        <form th:action="@{/company/project/edit/{id}(id=${project.id})}" method="post">
            <div class="form-grid">
                
                <div class="form-group full-width">
                    <label for="title">Project Title *</label>
                    <input type="text" id="title" name="title" th:value="${project.title}" required>
                </div>

                <div class="form-group">
                    <label for="domain">Domain / Technology Field *</label>
                    <input type="text" id="domain" name="domain" th:value="${project.domain}">
                </div>

                <div class="form-group">
                    <label for="status">Project Status *</label>
                    <select id="status" name="status">
                        <option value="OPEN" th:selected="${project.status == 'OPEN'}">OPEN (Accepting Applications)</option>
                        <option value="IN_PROGRESS" th:selected="${project.status == 'IN_PROGRESS'}">IN_PROGRESS (Active)</option>
                        <option value="COMPLETED" th:selected="${project.status == 'COMPLETED'}">COMPLETED</option>
                        <option value="CLOSED" th:selected="${project.status == 'CLOSED'}">CLOSED</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="requiredSkills">Required Skills (Comma Separated) *</label>
                    <input type="text" id="requiredSkills" name="requiredSkills" th:value="${project.requiredSkills}" required>
                </div>

                <div class="form-group full-width">
                    <label for="description">Project Description *</label>
                    <textarea id="description" name="description" th:text="${project.description}" required></textarea>
                </div>

                <div class="form-group">
                    <label for="duration">Project Duration</label>
                    <input type="text" id="duration" name="duration" th:value="${project.duration}">
                </div>

                <div class="form-group">
                    <label for="difficultyLevel">Difficulty Level</label>
                    <input type="text" id="difficultyLevel" name="difficultyLevel" th:value="${project.difficultyLevel}">
                </div>

                <div class="form-group">
                    <label for="startDate">Target Start Date</label>
                    <input type="date" id="startDate" name="startDate" th:value="${project.startDate}">
                </div>

                <div class="form-group">
                    <label for="endDate">Target End Date</label>
                    <input type="date" id="endDate" name="endDate" th:value="${project.endDate}">
                </div>

            </div>

            <div style="display:flex; gap:12px; margin-top:20px;">
                <button type="submit" class="btn btn-primary">💾 Update Project</button>
                <a href="/company/projects" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
